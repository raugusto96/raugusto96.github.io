name: portfolio-ranking
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio_ranking
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ranking-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_ranking"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ranking-data:
